<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nasza Randka ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

* {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    margin:0;
    min-height:100vh;
    background:
    linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.heart {
    position:absolute;
    font-size:25px;
    animation:float 8s infinite;
    opacity:.5;
}

@keyframes float {
    from {
        transform:translateY(100vh);
    }
    to {
        transform:translateY(-20vh);
    }
}


.card {

    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:30px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.2);

    text-align:center;

    animation:show 1s;
}


@keyframes show {
    from {
        transform:scale(.8);
        opacity:0;
    }
    to {
        transform:scale(1);
        opacity:1;
    }
}


h1 {
    color:#e75480;
    font-size:32px;
}

p {
    color:#555;
    line-height:1.6;
}


input, textarea {

    width:100%;
    padding:14px;

    margin-top:10px;
    margin-bottom:15px;

    border-radius:15px;
    border:1px solid #ddd;

    font-size:16px;

}


button {

    width:100%;
    padding:15px;

    border:none;
    border-radius:30px;

    background:#e75480;
    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}


button:hover {

    transform:scale(1.05);

}


#result {

    display:none;

    font-size:22px;
    color:#e75480;

}

</style>

</head>


<body>


<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:50%;animation-delay:2s">💕</div>
<div class="heart" style="left:80%;animation-delay:4s">❤️</div>


<div class="card">


<h1>❤️ Siemka Amelciu ❤️</h1>
<h3>❤️ Zapraszam Cię na randkę! ❤️</h3>


<p>
Chciałbym spędzić z Tobą wyjątkowy dzień.
<br>
Wybierz kiedy mam Cię zabrać na randkę 🥰
</p>



<form id="dateForm">


<input 
type="date"
id="date"
name="date"
required>


<input
type="time"
id="time"
name="time"
required>


<textarea

id="message"

placeholder="Możesz coś dopisać ❤️"

></textarea>


<button>
Rezerwuję randkę 💕
</button>


</form>



<div id="result">

💌 Super!<br>
Nie mogę się doczekać ❤️

</div>


</div>



<script>


emailjs.init({

publicKey:"TUTAJ_WKLEJ_PUBLIC_KEY"

});



document
.getElementById("dateForm")
.addEventListener("submit",function(e){


e.preventDefault();



let params={


date:
document.getElementById("date").value,


time:
document.getElementById("time").value,


message:
document.getElementById("message").value


};



emailjs.send(

"TUTAJ_SERVICE_ID",

"TUTAJ_TEMPLATE_ID",

params

)

.then(()=>{


document.getElementById("dateForm").style.display="none";

document.getElementById("result").style.display="block";


})


.catch(error=>{

alert(
"Coś poszło nie tak 😢"
);

console.log(error);

});


});


</script>


</body>
</html>
